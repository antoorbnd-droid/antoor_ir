<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فروشگاه آنتور</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:20px;text-align:center}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;color:#ccc}
main{max-width:650px;margin:auto;padding:15px}
button{border:0;border-radius:10px;padding:12px;font-size:15px}
.adminBtn{width:100%;background:#16a34a;color:white;margin-bottom:12px}
.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:10px}
.categories{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
.categories button{background:white;white-space:nowrap}
.categories button.active{background:#111;color:white}
.card{background:white;border-radius:16px;padding:12px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:220px;object-fit:cover;border-radius:12px}
.card h3{margin:10px 0 5px}
.category{font-size:13px;color:#777}
.price{color:#16a34a;font-size:19px;font-weight:bold;margin:8px 0}
.stock{font-size:14px;margin-bottom:10px}
.buy{width:100%;background:#111;color:white}
.buy:disabled{background:#aaa}
.edit,.delete{width:49%;margin-top:7px}
.edit{background:#eee}
.delete{background:#fee2e2;color:#991b1b}
.cart{background:white;padding:15px;border-radius:16px;margin-top:20px}
.order{width:100%;background:#111;color:white;margin-top:12px}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:18px;z-index:10}
.box{background:white;border-radius:16px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
input,textarea,select{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.save{width:100%;background:#16a34a;color:white;margin-top:8px}
.close{width:100%;background:#ddd;margin-top:7px}
#preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:none;margin-top:8px}
.empty{text-align:center;padding:25px;color:#777}
.total{font-size:18px}
</style>
<link rel="manifest" href="/manifest.json"></head>

<body>

<header>
<h1>🛍️ فروشگاه آنتور</h1>
<p>خرید آسان و سریع</p>
</header>

<main>

<button class="adminBtn" onclick="openAdd()">➕ افزودن محصول</button>

<input class="search" id="search" placeholder="🔎 جستجوی محصول..." oninput="showProducts()">

<div class="categories" id="categories"></div>

<div id="products"></div>

<div class="cart">
<h3>🛒 سبد خرید</h3>
<div id="cart">سبد خرید خالی است</div>
<hr>
<div class="total">
جمع: <b id="total">0</b> تومان
</div>
<button class="order" onclick="openOrder()">📦 ثبت سفارش</button>
</div>

</main>

<!-- افزودن / ویرایش -->

<div class="modal" id="productModal">
<div class="box">

<h2 id="modalTitle">➕ افزودن محصول</h2>

<input id="name" placeholder="نام محصول">

<input id="price" type="number" placeholder="قیمت به تومان">

<input id="stock" type="number" placeholder="موجودی">

<input id="category" placeholder="دسته‌بندی؛ مثلاً عطر">

<input id="image" type="file" accept="image/*" onchange="chooseImage(event)">

<img id="preview">

<button class="save" onclick="saveProduct()">ذخیره محصول</button>
<button class="close" onclick="closeProduct()">بستن</button>

</div>
</div>

<!-- سفارش -->

<div class="modal" id="orderModal">
<div class="box">

<h2>📦 ثبت سفارش</h2>

<input id="customerName" placeholder="نام و نام خانوادگی">

<input id="phone" placeholder="شماره تماس">

<textarea id="address" rows="4" placeholder="آدرس کامل"></textarea>

<button class="save" onclick="sendOrder()">📲 ارسال به واتساپ</button>
<button class="close" onclick="closeOrder()">بستن</button>

</div>
</div>

<script>

let products=JSON.parse(localStorage.getItem("products")||"[]");
let cart=[];
let selectedImage="";
let editIndex=-1;
let currentCategory="همه";

function saveData(){
localStorage.setItem("products",JSON.stringify(products));
}

function openAdd(){

editIndex=-1;
selectedImage="";

document.getElementById("modalTitle").innerText="➕ افزودن محصول";
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("stock").value="";
document.getElementById("category").value="";
document.getElementById("image").value="";

document.getElementById("preview").style.display="none";

document.getElementById("productModal").style.display="flex";
}

function closeProduct(){
document.getElementById("productModal").style.display="none";
}

function chooseImage(e){

let file=e.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(){

selectedImage=reader.result;

let preview=document.getElementById("preview");

preview.src=selectedImage;
preview.style.display="block";

};

reader.readAsDataURL(file);
}

function saveProduct(){

let name=document.getElementById("name").value.trim();
let price=Number(document.getElementById("price").value);
let stock=Number(document.getElementById("stock").value||0);
let category=document.getElementById("category").value.trim()||"عمومی";

if(!name||!price){

alert("نام و قیمت را وارد کن");
return;
}

if(editIndex===-1){

products.push({
name:name,
price:price,
stock:stock,
category:category,
image:selectedImage
});

}else{

products[editIndex].name=name;
products[editIndex].price=price;
products[editIndex].stock=stock;
products[editIndex].category=category;

if(selectedImage){
products[editIndex].image=selectedImage;
}

}

saveData();
closeProduct();
showProducts();
showCategories();

alert("ذخیره شد ✅");
}

function editProduct(i){

editIndex=i;
selectedImage="";

let p=products[i];

document.getElementById("modalTitle").innerText="✏️ ویرایش محصول";
document.getElementById("name").value=p.name;
document.getElementById("price").value=p.price;
document.getElementById("stock").value=p.stock||0;
document.getElementById("category").value=p.category||"عمومی";

let preview=document.getElementById("preview");

if(p.image){

preview.src=p.image;
preview.style.display="block";

}else{

preview.style.display="none";

}

document.getElementById("productModal").style.display="flex";
}

function deleteProduct(i){

if(!confirm("این محصول حذف شود؟"))return;

products.splice(i,1);
saveData();
showProducts();
showCategories();
}

function showCategories(){

let cats=["همه"];

products.forEach(p=>{

let c=p.category||"عمومی";

if(!cats.includes(c))cats.push(c);

});

let box=document.getElementById("categories");

box.innerHTML=cats.map(c=>`

<button class="${currentCategory===c?"active":""}"
onclick="setCategory('${escapeText(c)}')">

${c}

</button>

`).join("");
}

function setCategory(c){

currentCategory=c;
showCategories();
showProducts();
}

function escapeText(s){

return s.replace(/'/g,"&#39;");

}

function showProducts(){

let box=document.getElementById("products");

let search=document.getElementById("search").value.trim().toLowerCase();

let list=products.filter(p=>{

let matchSearch=p.name.toLowerCase().includes(search);

let matchCategory=currentCategory==="همه" ||
(p.category||"عمومی")===currentCategory;

return matchSearch&&matchCategory;

});

if(list.length===0){

box.innerHTML='<div class="empty">محصولی پیدا نشد.</div>';
return;
}

box.innerHTML=list.map(p=>{

let i=products.indexOf(p);
let stock=p.stock||0;

return `

<div class="card">

${p.image?`<img src="${p.image}">`:""}

<h3>${p.name}</h3>

<div class="category">
دسته: ${p.category||"عمومی"}
</div>

<div class="price">
${p.price.toLocaleString()} تومان
</div>

<div class="stock">
${stock>0?"موجودی: "+stock:"ناموجود"}
</div>

<button class="buy"
${stock<=0?"disabled":""}
onclick="addCart(${i})">

${stock>0?"🛒 افزودن به سبد":"ناموجود"}

</button>

<button class="edit" onclick="editProduct(${i})">
✏️ ویرایش
</button>

<button class="delete" onclick="deleteProduct(${i})">
🗑️ حذف
</button>

</div>

`;

}).join("");
}

function addCart(i){

if(products[i].stock<=0){

alert("این محصول موجود نیست");
return;
}

cart.push(products[i]);
products[i].stock--;

saveData();

showProducts();
showCart();
}

function removeCart(i){

let p=cart[i];

let product=products.find(x=>x.name===p.name);

if(product)product.stock++;

cart.splice(i,1);

saveData();

showProducts();
showCart();
}

function showCart(){

let box=document.getElementById("cart");

if(cart.length===0){

box.innerHTML="سبد خرید خالی است";
document.getElementById("total").innerText="0";
return;

}

let total=0;

box.innerHTML=cart.map((p,i)=>{

total+=p.price;

return `

<div>

<b>${p.name}</b>
<br>

${p.price.toLocaleString()} تومان

<button onclick="removeCart(${i})">
❌
</button>

</div>

<hr>

`;

}).join("");

document.getElementById("total").innerText=total.toLocaleString();
}

function openOrder(){

if(cart.length===0){

alert("اول محصولی به سبد خرید اضافه کن");
return;
}

document.getElementById("orderModal").style.display="flex";
}

function closeOrder(){

document.getElementById("orderModal").style.display="none";
}

function sendOrder(){

let name=document.getElementById("customerName").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();

if(!name||!phone||!address){

alert("لطفاً همه اطلاعات را وارد کن");
return;
}

let total=cart.reduce((sum,p)=>sum+p.price,0);

let text=
"🛍️ سفارش جدید از فروشگاه آنتور\n\n"+
"👤 نام: "+name+"\n"+
"📞 تلفن: "+phone+"\n"+
"📍 آدرس: "+address+"\n\n"+
"📦 محصولات:\n";

cart.forEach(p=>{

text+="- "+p.name+" : "+
p.price.toLocaleString()+" تومان\n";

});

text+="\n💰 جمع: "+
total.toLocaleString()+" تومان";

let url=
"https://wa.me/989309851273?text="+
encodeURIComponent(text);

window.location.href=url;
}

showCategories();
showProducts();
showCart();

</script>

</body>
</html>
